on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build (Legacy)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: Fix UEFI USB Boot Protocol compatibility
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          # 1. Remove select USB_DEVICE_SOF from zmk/app/Kconfig
          kconfig = Path("zmk/app/Kconfig")
          kconfig.write_text(kconfig.read_text().replace("\tselect USB_DEVICE_SOF\n", ""))

          # 2. ACK SET_IDLE / GET_IDLE in zephyr/subsys/usb/device/class/hid/core.c when SOF is disabled
          core_c = Path("zephyr/subsys/usb/device/class/hid/core.c")
          txt = core_c.read_text()
          txt = txt.replace(
              "static int hid_on_get_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n#ifdef CONFIG_USB_DEVICE_SOF",
              "static int hid_on_get_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n\tstatic uint8_t idle_zero = 0U;\n\t*data = &idle_zero;\n\t*len = sizeof(idle_zero);\n\treturn 0;\n#if 0"
          )
          txt = txt.replace(
              "static int hid_on_set_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n#ifdef CONFIG_USB_DEVICE_SOF",
              "static int hid_on_set_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n\treturn 0;\n#if 0"
          )
          core_c.write_text(txt)

          # 3. Support Boot Protocol Report ID 0 in zmk/app/src/usb_hid.c (GET_REPORT & SET_REPORT LEDs)
          usb_hid_c = Path("zmk/app/src/usb_hid.c")
          uh = usb_hid_c.read_text()
          uh = uh.replace(
              "        case ZMK_HID_REPORT_ID_KEYBOARD: {",
              "        case 0:\n        case ZMK_HID_REPORT_ID_KEYBOARD: {"
          )
          uh = uh.replace(
              "    case HID_REPORT_TYPE_OUTPUT:\n        switch (setup->wValue & HID_GET_REPORT_ID_MASK) {",
              "    case HID_REPORT_TYPE_OUTPUT:\n        switch (setup->wValue & HID_GET_REPORT_ID_MASK) {\n        case 0:\n            return 0;"
          )
          usb_hid_c.write_text(uh)

          # 4. Place HID Boot Keyboard on Interface 0 before CDC ACM in zephyr/subsys/usb/device/class/cdc_acm.c
          cdc_c = Path("zephyr/subsys/usb/device/class/cdc_acm.c")
          ct = cdc_c.read_text()
          ct = ct.replace(
              "\tdesc->iad_cdc.bFirstInterface = bInterfaceNumber;\n",
              "\tdesc->if0_cm.bDataInterface = bInterfaceNumber + 1;\n\tdesc->iad_cdc.bFirstInterface = bInterfaceNumber;\n"
          )
          ct = ct.replace(
              "#define CDC_ACM_CFG_AND_DATA_DEFINE(x)\t\t\t\t\t\\\n\tUSBD_CLASS_DESCR_DEFINE(primary, x)",
              "#define CDC_ACM_CFG_AND_DATA_DEFINE(x)\t\t\t\t\t\\\n\tUSBD_CLASS_DESCR_DEFINE(primary, 9)"
          )
          cdc_c.write_text(ct)
          EOF
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-no-clique
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2
  build-clique:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build (Clique)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit clique
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: Fix UEFI USB Boot Protocol compatibility
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          # 1. Remove select USB_DEVICE_SOF from zmk/app/Kconfig
          kconfig = Path("zmk/app/Kconfig")
          kconfig.write_text(kconfig.read_text().replace("\tselect USB_DEVICE_SOF\n", ""))

          # 2. ACK SET_IDLE / GET_IDLE in zephyr/subsys/usb/device/class/hid/core.c when SOF is disabled
          core_c = Path("zephyr/subsys/usb/device/class/hid/core.c")
          txt = core_c.read_text()
          txt = txt.replace(
              "static int hid_on_get_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n#ifdef CONFIG_USB_DEVICE_SOF",
              "static int hid_on_get_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n\tstatic uint8_t idle_zero = 0U;\n\t*data = &idle_zero;\n\t*len = sizeof(idle_zero);\n\treturn 0;\n#if 0"
          )
          txt = txt.replace(
              "static int hid_on_set_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n#ifdef CONFIG_USB_DEVICE_SOF",
              "static int hid_on_set_idle(struct hid_device_info *dev_data,\n"
              "\t\t\t   struct usb_setup_packet *setup, int32_t *len,\n"
              "\t\t\t   uint8_t **data)\n{\n\treturn 0;\n#if 0"
          )
          core_c.write_text(txt)

          # 3. Support Boot Protocol Report ID 0 in zmk/app/src/usb_hid.c (GET_REPORT & SET_REPORT LEDs)
          usb_hid_c = Path("zmk/app/src/usb_hid.c")
          uh = usb_hid_c.read_text()
          uh = uh.replace(
              "        case ZMK_HID_REPORT_ID_KEYBOARD: {",
              "        case 0:\n        case ZMK_HID_REPORT_ID_KEYBOARD: {"
          )
          uh = uh.replace(
              "    case HID_REPORT_TYPE_OUTPUT:\n        switch (setup->wValue & HID_GET_REPORT_ID_MASK) {",
              "    case HID_REPORT_TYPE_OUTPUT:\n        switch (setup->wValue & HID_GET_REPORT_ID_MASK) {\n        case 0:\n            return 0;"
          )
          usb_hid_c.write_text(uh)

          # 4. Place HID Boot Keyboard on Interface 0 before CDC ACM in zephyr/subsys/usb/device/class/cdc_acm.c
          cdc_c = Path("zephyr/subsys/usb/device/class/cdc_acm.c")
          ct = cdc_c.read_text()
          ct = ct.replace(
              "\tdesc->iad_cdc.bFirstInterface = bInterfaceNumber;\n",
              "\tdesc->if0_cm.bDataInterface = bInterfaceNumber + 1;\n\tdesc->iad_cdc.bFirstInterface = bInterfaceNumber;\n"
          )
          ct = ct.replace(
              "#define CDC_ACM_CFG_AND_DATA_DEFINE(x)\t\t\t\t\t\\\n\tUSBD_CLASS_DESCR_DEFINE(primary, x)",
              "#define CDC_ACM_CFG_AND_DATA_DEFINE(x)\t\t\t\t\t\\\n\tUSBD_CLASS_DESCR_DEFINE(primary, 9)"
          )
          cdc_c.write_text(ct)
          EOF
      - name: West Zephyr export
        run: west zephyr-export
      - name: West Build (left)
        run: west build -s zmk/app -d build/left -b adv360_left -S studio-rpc-usb-uart -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_STUDIO=y
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: west build -s zmk/app -d build/right -b adv360_right -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"
